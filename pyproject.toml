[project]
name = "trident"
version = "0.1.0"
description = "Tree-sitter semantic code graph + vector embedding pipeline"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-solidity>=1.2",
    "tree-sitter-go>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "tiktoken>=0.6",
    "openai>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "viztracer>=0.16",
]
benchmark = [
    "claude-agent-sdk>=0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
trident-graph = "cli.graph:main"
trident-benchmark = "benchmark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "db*", "benchmark*", "configs*"]

# Ship runtime data files that are loaded by path, not import:
#  - db/migrations/*.sql  → `db.connection.apply_migrations` (--init-schema).
#  - configs/*.yaml,*.json → `core.config_loader` loads <language>.yaml +
#    _schema.json via `Path(__file__).parent.parent / "configs"`. Without these,
#    wheels/git installs silently skip Tier 2 resolution (0 definitions).
# `configs/` is shipped as a package (it has an __init__.py) so packages.find
# picks it up and this package-data entry travels with it.
[tool.setuptools.package-data]
db = ["migrations/*.sql"]
configs = ["*.yaml", "*.json"]
