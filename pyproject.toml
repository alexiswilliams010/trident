[project]
name = "trident"
version = "0.1.0"
description = "Tree-sitter semantic code graph + vector embedding pipeline"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-solidity>=1.2",
    "tree-sitter-go>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "tiktoken>=0.6",
    "openai>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "viztracer>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
trident-graph = "cli.graph:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "db*"]
